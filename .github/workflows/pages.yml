name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construir
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "Todavía no hay proyecto: publico la portada provisional."
            mkdir -p dist
            cp ops/portada-provisional.html dist/index.html
          fi
          # El dominio propio depende de que CNAME llegue al sitio publicado.
          cp public/CNAME dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
