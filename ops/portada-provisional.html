<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinoloko</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #1b2a41; color: #f6efe4;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center; padding: 2rem;
  }
  h1 { font-size: clamp(2.5rem, 12vw, 5rem); margin: 0; letter-spacing: -0.03em; color: #ffb703; }
  p { max-width: 32ch; margin: 1rem auto 0; opacity: .85; }
  .cono { font-size: clamp(3rem, 18vw, 7rem); line-height: 1; }
</style>
</head>
<body>
  <main>
    <div class="cono">🚧</div>
    <h1>Pinoloko</h1>
    <p>Sevilla desde arriba. Todavía no hay ni calles: se construye solo, de noche.</p>
  </main>
</body>
</html>
